<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>keydir-aggregator</title>
<style>
  :root{
    --bg:#0b0e11; --panel:#12161b; --panel2:#181d24; --border:#232a33;
    --text:#e6e9ee; --dim:#8b94a1; --green:#22c55e; --cyan:#22d3ee; --purple:#a78bfa; --red:#ef4444;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:14px}
  a{color:var(--cyan);text-decoration:none}
  header{position:sticky;top:0;z-index:20;background:#0d1014ee;backdrop-filter:blur(6px);border-bottom:2px solid var(--border);padding:14px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  header h1{font-size:18px;letter-spacing:2px}
  header h1 span{color:var(--green)}
  .tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  input,select,button,textarea{font:inherit;color:var(--text)}
  input,select{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 10px;outline:none}
  input:focus,select:focus{border-color:var(--cyan)}
  input[type=search]{min-width:220px}
  button{cursor:pointer;border:1px solid var(--border);background:var(--panel2);border-radius:6px;padding:7px 12px;transition:.15s}
  button:hover{border-color:var(--cyan)}
  button:disabled{opacity:.5;cursor:wait}
  button.primary{background:#14532d;border-color:#16a34a;color:#bbf7d0;font-weight:600}
  button.danger{border-color:#7f1d1d;color:#fca5a5}
  main{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px 22px;max-width:1500px;margin:0 auto}
  aside{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;height:fit-content;position:sticky;top:78px}
  aside h2{font-size:12px;letter-spacing:2px;color:var(--dim);margin-bottom:12px}
  #vendor-form{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  #vendor-form button{margin-top:4px}
  .vendor{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--panel2)}
  .vendor .meta{flex:1;min-width:0}
  .vendor .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vendor .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vendor button{padding:5px 8px;font-size:12px}
  .vendor .del{padding:5px 7px;color:var(--dim)}
  #stats{font-size:12px;color:var(--dim);margin-bottom:10px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
  .card:hover{border-color:var(--cyan);transform:translateY(-2px)}
  .card img{width:100%;height:130px;object-fit:cover;background:#0d1014}
  .card .pad{padding:10px 12px 12px}
  .card .n{font-weight:600;line-height:1.25;height:2.5em;overflow:hidden}
  .card .pr{color:var(--green);font-weight:700;margin-top:4px}
  .card .pr s{color:var(--dim);font-weight:400}
  .card .meta{font-size:11px;color:var(--dim);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
  .chip{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--border)}
  .chip.instock{color:#86efac;border-color:#166534}
  .chip.out{color:#fca5a5;border-color:#7f1d1d}
  .chip.unknown{color:var(--dim)}
  #detail{position:fixed;inset:0;z-index:40;background:#0009;display:flex;justify-content:flex-end}
  #detail.hidden{display:none}
  #sheet{width:min(1100px,100%);height:100%;background:var(--bg);border-left:2px solid var(--border);overflow-y:auto;padding:0}
  #sheet .top{position:sticky;top:0;background:var(--panel);border-bottom:2px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:10px}
  #sheet .top h2{font-size:15px;flex:1}
  #sheet .top a{font-size:12px}
  #sheet .body{padding:22px;max-width:1000px}
  .gallery{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
  .gallery img{height:160px;border:1px solid var(--border);border-radius:8px}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:16px 0}
  .field{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px}
  .field .k{font-size:10px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
  .field .v{font-weight:600;margin-top:3px;word-break:break-word}
  h3{font-size:12px;letter-spacing:2px;color:var(--dim);margin:22px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:var(--panel);color:var(--dim);font-weight:600;white-space:nowrap}
  pre{background:#0d1014;border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;max-height:420px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word}
  .actions{display:flex;gap:8px;margin:12px 0}
  .toast{position:fixed;bottom:18px;right:18px;background:#14532d;border:1px solid #16a34a;color:#bbf7d0;padding:10px 16px;border-radius:8px;z-index:60}
  @media(max-width:900px){main{grid-template-columns:1fr}aside{position:static}}
</style>
</head>
<body>
<header>
  <h1>KEYDIR <span>AGGREGATOR</span></h1>
  <div class="tools">
    <input id="q" type="search" placeholder="Search products…" autocomplete="off">
    <select id="f-vendor"></select>
    <select id="f-cat"></select>
    <select id="f-stock">
      <option value="">All stock</option>
      <option value="in_stock">In stock</option>
      <option value="out_of_stock">Out of stock</option>
      <option value="pre_order">Pre-order</option>
    </select>
    <button class="primary" onclick="exportAll('json')">EXPORT ALL JSON</button>
    <button class="primary" onclick="exportAll('csv')">EXPORT ALL CSV</button>
  </div>
</header>
<main>
  <aside>
    <h2>VENDORS</h2>
    <form id="vendor-form">
      <input name="name" placeholder="Vendor name" required>
      <input name="website" placeholder="Website" required>
      <input name="category" placeholder="Category (e.g. keebs)">
      <input name="url" type="url" placeholder="Product or collection URL" required>
      <button type="submit" class="primary">+ ADD VENDOR</button>
    </form>
    <div id="vendor-list"></div>
  </aside>
  <section>
    <div id="stats"></div>
    <div id="grid"></div>
  </section>
</main>
<div id="detail" class="hidden">
  <div id="sheet">
    <div class="top">
      <h2 id="d-name"></h2>
      <a id="d-url" target="_blank" rel="noopener">visit site ↗</a>
      <button onclick="exportOne(currentSlug, currentPid, 'json')">JSON</button>
      <button onclick="exportOne(currentSlug, currentPid, 'csv')">CSV</button>
      <button onclick="closeDetail()">CLOSE</button>
    </div>
    <div class="body" id="d-body"></div>
  </div>
</div>
<div id="toast" class="toast" style="display:none"></div>
<script>
let vendors = [], products = [], currentSlug = null, currentPid = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney = v => v != null && !isNaN(v) ? '₹' + Number(v).toLocaleString('en-IN') : '—';
const fmtStock = s => {
  const map = {in_stock:'IN STOCK', out_of_stock:'OUT OF STOCK', pre_order:'PRE-ORDER', back_order:'BACK-ORDER', coming_soon:'COMING SOON'};
  return map[s] || (s ? s.toUpperCase() : 'UNKNOWN');
};

function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600); }

async function api(path, opts){
  let r;
  try { r = await fetch(path, opts); }
  catch (e) { throw new Error('network error: ' + e.message); }
  let text = '';
  try { text = await r.text(); } catch (_) {}
  let j = {};
  if (text){
    try { j = JSON.parse(text); }
    catch (e) { throw new Error('bad response from ' + path + ' (HTTP ' + r.status + '): ' + text.slice(0, 120)); }
  }
  if (!r.ok || j.error) {
    let msg = j.error || 'HTTP ' + r.status + ' from ' + path;
    if (text.trimStart().startsWith('<!DOCTYPE') || text.trimStart().startsWith('<html') || r.status === 404 && !Object.keys(j).length) {
      msg += ' — not this server. Open http://localhost:8787 directly (not a forwarded/proxied URL) and hard-refresh (Ctrl+Shift+R).';
    }
    throw new Error(msg);
  }
  return j;
}

async function init(){
  try {
    await Promise.all([loadVendors(), loadProducts()]);
  } catch (e) {
    toast('Init error: ' + e.message);
    return;
  }
  renderVendors(); renderFilters(); renderGrid();
}
async function loadVendors(){ vendors = await api('/api/vendors'); }
async function loadProducts(){
  products = await api('/api/products');
  products.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}

function renderVendors(){
  const el = $('vendor-list');
  if (!vendors.length){ el.innerHTML = '<div style="color:var(--dim);font-size:12px">No vendors yet. Add one above.</div>'; return; }
  el.innerHTML = vendors.map(v => `
    <div class="vendor">
      <div class="meta">
        <div class="name">${esc(v.name)}</div>
        <div class="sub">${esc(v.category||'no category')} · ${esc(v.website)}</div>
      </div>
      <button class="primary" data-vid="${v.id}" onclick="scrape('${v.id}')">SCRAPE</button>
      <button class="del" title="Delete vendor + data" onclick="removeVendor('${v.id}')">✕</button>
    </div>`).join('');
}

function renderFilters(){
  $('f-vendor').innerHTML = '<option value="">All vendors</option>' + vendors.map(v=>`<option value="${esc(v.id)}">${esc(v.name)}</option>`).join('');
  const cats = [...new Set(products.map(p=>p.category).filter(Boolean))];
  $('f-cat').innerHTML = '<option value="">All categories</option>' + cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
}

function filtered(){
  const q = $('q').value.toLowerCase();
  const fv = $('f-vendor').value, fc = $('f-cat').value, fs = $('f-stock').value;
  return products.filter(p => {
    if (fv && p.vendorId !== fv) return false;
    if (fc && (p.category||'') !== fc) return false;
    if (fs && (p.stockStatus||'') !== fs) return false;
    if (q){
      const blob = [p.name, p.brand, p.sku, p.description, p.vendor,
        Object.entries(p.specs||{}).map(([k,v])=>k+':'+v).join(' ')].join(' ').toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function renderGrid(){
  const list = filtered();
  $('stats').textContent = `${list.length} / ${products.length} products`;
  if (!list.length){ $('grid').innerHTML = '<div style="color:var(--dim);padding:40px;text-align:center">Nothing here. Add a vendor and hit SCRAPE.</div>'; return; }
  $('grid').innerHTML = list.map(p => {
    const s = (p.stockStatus||'unknown');
    return `<div class="card" onclick="openDetail('${p.vendorId}','${p.id}')">
      <img loading="lazy" src="${esc(p.images?.[0] || '')}" onerror="this.style.display='none'">
      <div class="pad">
        <div class="n">${esc(p.name||'untitled')}</div>
        <div class="pr">${fmtMoney(p.price)}${p.comparePrice?` <s>${fmtMoney(p.comparePrice)}</s>`:''}</div>
        <div class="meta"><span>${esc(p.vendor||'')}</span><span class="chip ${s}">${fmtStock(s)}</span></div>
      </div>
    </div>`;
  }).join('');
}

async function scrape(vid){
  const b = document.querySelector(`[data-vid="${vid}"]`);
  const old = b.textContent;
  b.disabled = true; b.textContent = 'SCRAPING…';
  try {
    const r = await api('/api/scrape', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({vendorId:vid, limit:50})});
    await loadProducts();
    renderFilters(); renderGrid();
    toast(`${r.saved} saved${r.errors?`, ${r.errors} errors`:''}${r.scanned>r.saved?`, ${r.scanned-r.saved-r.errors} duplicates/skipped`:''}`);
  } catch(e){ toast('Error: ' + e.message); }
  b.disabled = false; b.textContent = old;
}

async function removeVendor(vid){
  if (!confirm('Delete this vendor and all its scraped products?')) return;
  await api(`/api/vendors/${vid}/delete`, {method:'POST'});
  await init();
}

$('vendor-form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, body = Object.fromEntries(new FormData(f).entries());
  try {
    await api('/api/vendors', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    f.reset();
    await loadVendors(); await loadProducts();
    renderVendors(); renderFilters(); renderGrid();
    toast('Vendor added');
  } catch(err){ toast('Error: ' + err.message); }
});

['q','f-vendor','f-cat','f-stock'].forEach(id => $(id).addEventListener('input', renderGrid));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

function openDetail(slug, pid){
  currentSlug = slug; currentPid = pid;
  api(`/api/products/${slug}/${pid}`).then(renderDetail).catch(e => toast('Error: ' + e.message));
  $('detail').classList.remove('hidden');
}
function closeDetail(){ $('detail').classList.add('hidden'); }

function renderDetail(p){
  $('d-name').textContent = p.name || 'Untitled product';
  $('d-url').href = p.url;
  const s = (p.stockStatus||'unknown');
  const img = (p.images||[]).length ? `<div class="gallery">${p.images.map(i=>`<img loading="lazy" src="${esc(i)}" onerror="this.style.display='none'">`).join('')}</div>` : '';
  const fields = [
    ['Brand', p.brand], ['SKU', p.sku], ['Price', fmtMoney(p.price)],
    ['Compare', p.comparePrice?fmtMoney(p.comparePrice):'—'], ['Stock', fmtStock(s)],
    ['Availability', p.availability], ['Vendor', p.vendor], ['Category', p.category],
    ['Last updated', p.lastUpdated?p.lastUpdated.slice(0,19).replace('T',' '):'—'],
  ].filter(([k,v])=>v && v !== '—').map(([k,v])=>`<div class="field"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('');
  const badges = (p.badges||[]).length ? `<h3>BADGES</h3><div class="actions">${p.badges.map(b=>`<span class="chip">${esc(b)}</span>`).join('')}</div>` : '';
  const tags = (p.tags||[]).length ? `<h3>TAGS</h3><div class="actions">${p.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>` : '';
  const crumbs = (p.breadcrumbs||[]).length ? `<div style="font-size:12px;color:var(--dim);margin:12px 0">${p.breadcrumbs.map(esc).join(' › ')}</div>` : '';
  const specs = Object.keys(p.specs||{}).length
    ? `<h3>SPECIFICATIONS</h3><table><tr><th>Spec</th><th>Value</th></tr>${Object.entries(p.specs).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>` : '';
  const variants = (p.variants||[]).length
    ? `<h3>VARIANTS</h3><table><tr><th>Name</th><th>Color</th><th>Switch</th><th>Keycaps</th><th>Price</th><th>Stock</th><th>SKU</th></tr>${
        p.variants.map(v=>`<tr><td>${esc(v.name||'')}</td><td>${esc(v.color||'')}</td><td>${esc(v.switch||'')}</td><td>${esc(v.keycaps||'')}</td><td>${fmtMoney(v.price)}</td><td>${esc(v.availability||v.stockStatus||'')}</td><td>${esc(v.sku||'')}</td></tr>`).join('')}</table>`
    : '';
  const coupons = (p.coupons||[]).length ? `<h3>COUPONS</h3><div class="actions">${p.coupons.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>` : '';
  const shipping = p.shipping ? `<h3>SHIPPING</h3><p style="color:var(--dim)">${esc(p.shipping)}</p>` : '';
  const desc = p.description ? `<h3>DESCRIPTION</h3><p>${esc(p.description)}</p>` : '';
  const raw = `<h3>RAW TEXT</h3><pre>${esc(p.rawText||'')}</pre>`;
  const html = `<h3>RAW HTML</h3><pre>${esc(p.rawHtml||'')}</pre>`;
  const json = `<h3>JSON</h3><pre id="d-json">${esc(JSON.stringify(p, null, 2))}</pre>`;
  $('d-body').innerHTML = crumbs + img + fields + desc + specs + variants + coupons + shipping + badges + tags + raw + html + json;
  $('d-body').scrollTop = 0;
  $('sheet').scrollTop = 0;
}

function exportAll(fmt){
  const fv = $('f-vendor').value;
  const url = '/api/export?format=' + fmt + (fv ? '&vendor=' + encodeURIComponent(fv) : '');
  window.location = url;
}
function exportOne(slug, pid, fmt){
  window.location = `/api/export?format=${fmt}&vendor=${encodeURIComponent(slug)}&id=${encodeURIComponent(pid)}`;
}

init();
</script>
</body>
</html>
